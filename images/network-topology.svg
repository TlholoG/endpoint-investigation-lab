<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Endpoint Investigation Lab: Network Topology</text>

  <!-- Zones -->
  <rect x="20" y="110" width="410" height="340" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="34" y="134" font-size="13" font-weight="700" fill="#1d4ed8">Household network  |  192.168.3.x</text>

  <rect x="470" y="110" width="410" height="340" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="484" y="134" font-size="13" font-weight="700" fill="#c2410c">Lab network  |  10.0.0.x  (isolated behind D-Link NAT)</text>

  <!-- Top chain -->
  <rect x="20" y="48" width="140" height="48" rx="24" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="90" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Internet</text>

  <rect x="210" y="48" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="310" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Fibre terminal + modem</text>
  <text x="310" y="85" text-anchor="middle" font-size="11" fill="#4b5563">ISP supplied</text>

  <line x1="160" y1="72" x2="208" y2="72" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="96" x2="310" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Huawei -->
  <rect x="50" y="160" width="350" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Huawei WS7100</text>
  <text x="225" y="206" text-anchor="middle" font-size="12" fill="#374151">Gateway 192.168.3.1  |  DHCP  |  household Wi-Fi</text>

  <!-- Household devices -->
  <rect x="50" y="260" width="350" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="283" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Household Wi-Fi devices</text>
  <text x="225" y="300" text-anchor="middle" font-size="11" fill="#4b5563">phones, TVs and other family devices</text>
  <line x1="150" y1="230" x2="150" y2="258" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Windows 11 -->
  <rect x="50" y="350" width="350" height="76" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Windows 11 computer</text>
  <text x="225" y="395" text-anchor="middle" font-size="12" fill="#374151">Admin workstation  |  TightVNC Viewer</text>
  <text x="225" y="412" text-anchor="middle" font-size="11" fill="#4b5563">Builds the live USB, runs analysis tools</text>
  <line x1="300" y1="230" x2="300" y2="348" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Huawei to D-Link -->
  <line x1="400" y1="195" x2="518" y2="195" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="459" y="180" text-anchor="middle" font-size="10" fill="#374151">Ethernet</text>
  <text x="459" y="215" text-anchor="middle" font-size="10" fill="#374151">LAN to WAN</text>

  <!-- D-Link -->
  <rect x="520" y="160" width="340" height="90" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="690" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">D-Link DWR-957M</text>
  <text x="690" y="205" text-anchor="middle" font-size="12" fill="#374151">WAN: 192.168.3.x (DHCP from Huawei)</text>
  <text x="690" y="222" text-anchor="middle" font-size="12" fill="#374151">LAN gateway: 10.0.0.2</text>
  <text x="690" y="239" text-anchor="middle" font-size="11" fill="#4b5563">NAT + firewall enabled  |  new INTERNET WAN profile</text>

  <!-- D-Link to Windows 8 -->
  <line x1="690" y1="250" x2="690" y2="348" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="304" font-size="11" fill="#374151">LAN / Wi-Fi (10.0.0.x)</text>

  <!-- Windows 8 -->
  <rect x="520" y="350" width="340" height="76" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="690" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Windows 8 laptop (infected target)</text>
  <text x="690" y="395" text-anchor="middle" font-size="12" fill="#374151">10.0.0.x  |  TightVNC Server (port 5900)</text>
  <text x="690" y="412" text-anchor="middle" font-size="11" fill="#4b5563">Data since 2010  |  no patches  |  treated as compromised</text>

  <!-- VNC path -->
  <line x1="400" y1="388" x2="518" y2="388" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>
  <text x="459" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">VNC</text>

  <!-- Legend -->
  <line x1="40" y1="480" x2="80" y2="480" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="484" font-size="12" fill="#374151">Wired / routed link</text>
  <line x1="240" y1="480" x2="280" y2="480" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>
  <text x="290" y="484" font-size="12" fill="#374151">Remote session (Windows 11 joins D-Link network while connected)</text>
  <text x="40" y="512" font-size="12" fill="#4b5563">Household devices cannot reach the lab, because the D-Link hides the 10.0.0.x network behind NAT.</text>
  <text x="40" y="530" font-size="12" fill="#4b5563">VNC is unencrypted, so it is used only inside the lab network and is never forwarded to the internet.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
